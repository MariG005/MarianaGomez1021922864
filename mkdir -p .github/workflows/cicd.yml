name: CI/CD - Calculadora C#

# Se ejecuta en cada push o pull request a la rama main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── JOB 1: BUILD & TEST ───────────────────────────────────────────────────
  build-and-test:
    name: Build y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar .NET 8
      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restaurar dependencias NuGet
      - name: Restaurar dependencias
        run: dotnet restore CalculadoraApp.sln

      # 4. Compilar la solución en modo Release
      - name: Compilar (Build)
        run: dotnet build CalculadoraApp.sln --configuration Release --no-restore

      # 5. Ejecutar pruebas unitarias
      - name: Ejecutar pruebas unitarias
        run: dotnet test tests/CalculadoraApp.Tests.csproj --configuration Release --no-build --verbosity normal

  # ─── JOB 2: PUBLISH (CD) ────────────────────────────────────────────────────
  publish:
    name: Publicar Aplicación
    runs-on: ubuntu-latest
    needs: build-and-test   # Solo se ejecuta si el job anterior pasa

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore CalculadoraApp.sln

      - name: Publicar aplicación
        run: dotnet publish src/CalculadoraApp.csproj --configuration Release --output ./publish

      - name: Listar artefactos publicados
        run: ls -la ./publish

      # Subir artefacto al repositorio de GitHub Actions
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-app
          path: ./publish
          retention-days: 7
